<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lumida">
  <title>Lumida</title>
  <defs>
    <radialGradient id="lumida-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- An aperture: a dark rounded square, a lens, and one point of light (the problem Lumida found). -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="#18181B" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="13" fill="#27272A"/>
  <circle cx="32" cy="32" r="13" fill="url(#lumida-glow)"/>
  <circle cx="32" cy="32" r="5.5" fill="#F59E0B"/>
  <circle cx="32" cy="32" r="2.6" fill="#FFFFFF"/>
</svg>
