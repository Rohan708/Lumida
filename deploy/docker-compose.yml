# Lumida, self-hosted: the service plus its own metadata database. Everything runs on
# this machine; nothing is sent to Lumida's makers.
#
# Needs only this file and .env (no source code):
#   cp .env.example .env        # then edit it (Windows: copy .env.example .env)
#   docker compose up -d        # pulls the published image
#   docker compose exec -it lumida lumida user add you@company.com --role admin
#   open http://127.0.0.1:8000
#
# Developers building from source: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Full guide: https://github.com/Rohan708/Lumida/blob/main/docs/setup/install.md

name: lumida

services:
  metadata:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lumida}
    volumes:
      - lumida-metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  lumida:
    # A specific version (e.g. 0.4.0) is safer than latest: set LUMIDA_VERSION in .env.
    image: ${LUMIDA_IMAGE:-ghcr.io/rohan708/lumida}:${LUMIDA_VERSION:-latest}
    env_file: .env
    environment:
      # The metadata store above; customer database URLs come from .env by name.
      LUMIDA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lumida}:${POSTGRES_PASSWORD}@metadata:5432/${POSTGRES_DB:-lumida}
    # The web app and API, on this machine only (put a TLS reverse proxy in front to reach
    # it from elsewhere). People log in with accounts made by `lumida user add`.
    ports:
      - "127.0.0.1:${LUMIDA_API_PUBLISH_PORT:-8000}:8000"
    depends_on:
      metadata:
        condition: service_healthy
    restart: unless-stopped
    # A run in progress finishes its current source before stopping.
    stop_grace_period: 5m

volumes:
  lumida-metadata:
